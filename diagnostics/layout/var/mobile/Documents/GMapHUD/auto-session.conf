# GMapHUD diagnostics collector configuration.
# The package reads this file on each tick. Keep paths local to the phone.
GVM_AUTO_RETENTION_DAYS=7
GVM_CMU_INTERVAL=300
GVM_CMU_IPS='192.168.53.1 192.168.100.1'
GVM_AUTO_ROOT='/var/mobile/Documents/GMapHUD/auto-sessions'
GVM_PHONE_LOG_ROOT='/var/mobile/Library/Logs'
GVM_CONTAINERS='/var/mobile/Containers/Data/Application'
GVM_COLLECTOR_VERSION=2
